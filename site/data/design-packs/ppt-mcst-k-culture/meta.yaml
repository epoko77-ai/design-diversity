diagram_kit: "(a) 2x2 매트릭스 + 사이드 ①~⑩ 리스트 (p-07 = p02-agenda 시그니처) — 좌 60% 4분면 매트릭스 (K-컬처 산업 violet #3D4EAA / 문화창조 산업 lavender pastel #BCC4F2 / 동반성장 산업 lavender dark #444F85 / 토대구축 soft lavender #A0B2E3, 각 분면 radius 12px + 흰 또는 navy Bold 22pt 카테고리 라벨 + 본문 3줄) + 우 40% ①~⑩ 번호 리스트 (작은 흰 fill + 1pt navy outline 원형 + navy 600 14pt 한 줄 텍스트, 토대구축 ①~⑤ / 문화창조산업 ⑥ / 동반성장산업 ⑦~⑧ / K-컬처 ⑨~⑩) / (b) K-컬처 산업 재정의 트리 (p-13 = p06-diagram 시그니처) — 중앙 K-컬처 brown pill (radius 999px, fill #8F6F56, white Bold 24pt) + 좌측 둥근 navy outline 박스 '문화창조 산업' 안에 navy solid 3열 inner pill 가로 배치 (콘텐츠/문화/예술 각 radius 999px fill navy white Bold 16pt) + 중앙 brown pill 아래 K-푸드/K-패션/K-뷰티/K-관광 일러스트 클립 4개 (원형 마스크 브라운 자연 톤) + 우측 다양성 사람 flat 일러스트 3개 (Made With Korea / K-브랜드 호감도 상승 / 소비재 제조업 수출증가, 각 라벨 navy Bold 14pt). 전체 외곽 둥근 모서리 1.5pt navy stroke 컨테이너 radius 16px / (c) navy pill 헤더 카드 모듈 (본문 페이지 기본 모듈, p-03·p-04·p-05·p-06·p-10·p-11·p-15·p-16·p-23·p-24 mirror) — 각 카드 = 둥근 navy pill 헤더 (radius 999px fill #32355D white Bold 20pt height 7%) + 흰 본문 박스 (radius 8px height 55% padding 3% 미세 그림자) + 내부 dashed 1px #DDE2EE 가로 구분선 + navy Bold 17pt lead 한 줄 + muted #5C5C63 Regular 14pt 2~3 항목. 카드 안 사진 클립(원형 또는 radius 12px 사각 마스크)은 선택적. 2-up/3-up/4-up 그리드. 본문 페이지의 workhorse 모듈 / (d) ▶▶ 갈매기 화살표 내러티브 (p-19·p-21·p-22·p-04 mirror = p09-narrative 시그니처) — 좌 55% ▶▶ 두 갈매기 V 화살표 불릿 4~5줄 (navy #32355D 또는 lavender #7285E4, 본문보다 1.2배 큰 사이즈) + 우측 navy Bold 18pt 한 줄 메시지, 줄 사이 3% 세로 간격 + 우 45% 동반 비주얼 (세계지도 도트 네트워크 #67A0A6 / 야시장 사진 / 휴대폰 mockup + SNS 인플루언서 협업 / 작은 다이어그램) / (e) K-관광 3천만 라인차트 + KPI 카드 + 빨강 CTA (p-20 mirror = p05-chart 시그니처) — 좌 60% 라인 차트 (x축 '00 '09 '15 '24 '25 '30, KR 라인 navy solid 2px polyline 532/762/1323/1870/1637/3000, JP 라인 red #E33D3C dashed 2px polyline 476/870/1974/3687/4000/6000, '24~'30 미래 구간 yellow #EAE7A0 alpha 0.5 음영, '24와 '30 사이 격차에 빨강 X2 마커 2개, 데이터 라벨 직접 표기 navy/red 14pt) + 우 40% KPI 카드 (흰 fill radius 8px + navy pill 헤더 '2030년 3천만 목표 조기 달성' white 18pt + 본문 navy Bold 16pt 2줄 + 위쪽 빨강 ↑ 화살표) + 하단 빨강 CTA 버튼 (radius 999px pill fill #E33D3C white Bold 16pt '관광 정책 컨트롤 타워 강화'). 차트 격자선·테두리 박스·범례 없음. 섹션 디바이더 = 풀-블리드 K-컬처 실사 사진 + 라벤더 #BCC4F2 alpha 0.65 베일 + 좌상단 outline pill 'Ⅰ 10대 핵심과제' + 흰 Black 52pt H1. 표지·종결 = 좌우 sweep 그라데이션 또는 좌 1/2 텍스트 + 우 1/2 실사 풀브리드. 정부 엠블럼은 표지·종결만 명확, 본문은 우상단 1.5%×3%만."
