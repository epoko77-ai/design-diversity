license: >-
  원자산은 SK텔레콤의 라이선스를 따름. 본 팩이 배포하는 것은 디자인 명세·토큰이며 원자산 사본·로고·서체 사본이 아님. 브랜드 영감은 brand_inspiration으로만
  참고하며 SK Sans 계열 SKT 독점 서체는 라이선스상 사용 불가 — 오픈 폰트 Pretendard(한글) + Inter(영문 보조)로 대체한다. SKT
  Electric Indigo `#0023C3`·딥 인디고 `#0010A7`·미디엄 블루 `#4B8CE6`·피라미드 단계 톤(`#DBE8FA`/`#2B65D8`)·`#E4EEFB`/`#C9DDF8`
  보조 톤은 공개 Annual Report 2024 PDF 픽셀 측정값으로 근사 표기. SKT Red `#EA002C`는 표지 SK telecom 로고에만 등장하며 본
  팩 사용 시에도 해당 위치 외 절대 금지.
