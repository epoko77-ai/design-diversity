diagram_kit: 5개 사업부문(Search Platform 그린 #03C75A / Commerce 퍼플 #7C5BFF / Fintech 민트 #1ED2C0 / Contents 코랄 #FF6A4A / Enterprise 블루 #4FB8FF)이 동일한 2x2 데이터 카드 표준(좌상=도넛+Mixed-size 거대 숫자 / 우상=거대 솔리드 컬러 원+흰 60pt 수치+보조 픽토그램 KPI / 좌하=2년 비교 가로 막대+델타 ▲ / 우하=분기별 막대+우측 56pt 합계)을 부문 컬러로만 변주. On-Service AI 인트로는 부문 컬러 풀블리드 메쉬 그라디언트+중앙 흰 UI 미니어처. On-Service AI 다이어그램(s9)은 4컬러 노드(그린/퍼플/블루/시안)가 1pt 검은 직선으로 중앙 그라디언트 텍스트 hub에 수렴. Key Milestones(s4)는 풀폭 0.5pt 회색 수평 라인+4구간 32pt Bold 시기+그린 도트 마일스톤. 노드 형태는 원형/둥근 사각형/라운드 라벨 박스 세 종, 커넥터는 1pt 검은 직선만(곡선은 p19 Next, N 무한대 1종 예외로 v3 10장 덱 외). 차트는 어워드급 단순화 — 격자선 없음, 축선 거의 생략, 범례 박스 없음, 직접 라벨링만, 단일 강조는 부문 컬러 1색+무채색 비교, 다부문 비교 도넛(s7)만 6색 동시 허용.
