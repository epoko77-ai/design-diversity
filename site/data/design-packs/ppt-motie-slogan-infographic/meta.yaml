differentiation:
  - >-
    vs baseline 정부 청색 PPT: 단조 청 단색이 아닌 네이비 단일 계열의
    풍부한 톤(#001838~#003070 + #0066CC~#00BCD4) + 캘리그래피 손글씨 슬로건이 차지하는
    지배적 비중 + 차트·표 부재라는 3박자가 baseline과 즉시 구별된다.
  - >-
    vs 일반 한국 정부 부처 합동 보고서: 부처합동 워드마크를 의도적으로 안 쓰고,
    태극 적색을 일절 안 쓰며(22장 중 0건), 정부 표준 폰트(KoPub) 대신
    캘리그래피 손글씨가 시그니처라는 점이 차별.
  - >-
    vs ppt-msit/molit/moel 등 청색 부처 팩: 슬로건 풀스크린이 30% 비율을 차지하고,
    카드 라벨이 청색 5단 그라데이션으로만 한정되며, K-산업방파제 5카드 3+2 비대칭과
    한국·세계 지도 6핀 인포그래픽이 본 팩 고유의 다이어그램 양식.
  - >-
    v1과의 결정적 차이: v1은 (a) 부처합동 워드마크, (b) 4-키컨셉 2×2 그리드,
    (c) 5층 사다리꼴 K-방파제, (d) 태극 청·적 듀얼톤, (e) 막대 차트를 가정했으나
    실측 결과 5건 모두 본 PPT에 없다. v2는 실측 기반으로 5건 모두 폐기·재정의.
  - >-
    v2 → v3 차이: v2 시그니처 11종(적색0·캘리그래피·슬로건 풀스크린·5단 블루 칩·4-키컨셉0·
    K-방파제 3+2·지도 6핀·호 글로우·차트0·breadcrumb·인용부호·단독 워드마크)을
    LOCKED로 유지하면서 22장 PNG 재정독 + 페이지 1:1 mirror plan + visual_lexicon 11종 통합 +
    22→10 페이지 압축 머지 규칙을 추가한 정밀화 버전. 페이지별 render note로
    재현 정확도를 한 단계 끌어올림.
