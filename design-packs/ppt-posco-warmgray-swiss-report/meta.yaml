differentiation: >-
  이 팩의 축은 "잉크가 적고 조용하되, 재무 리포트의 데이터 밀도를 가진다"이다 —
  실측 잉크 비율 커버 3.4%·재무제표 3.6%(팩 합격선 4%/4.5%), 헤더는 0.65pt
  헤어라인 하나, 저대비 위계(#619AFF 2.77:1·#9FA0A0 2.62:1)를 교정 없이 유지한다.
  카탈로그의 다른 미니멀 팩과의 구별 — ppt-keynote-minimal-fullbleed는 풀블리드
  사진이 색을 담당하고 한 슬라이드 한 메시지(airy·full-bleed)라 표·각주·KPI 열이
  없지만, 이 팩은 사진 0에 6페이지 반복 손익 차트 문법·13행 재무 표·페이지당
  2~6행 각주를 갖는다. ppt-minimal-mono-note는 모노스페이스 1서체·잉크 블랙
  1색의 노트형(centered)이지만, 이 팩은 블루 축 5단+그레이 3단 팔레트와 트윈
  패널·2×2 그리드의 strict-grid 데이터 지면이다. ppt-swiss-editorial-bold는 거대
  압축 디스플레이 활자를 일러스트로 쓰는 고잉크 에디토리얼(heavy-display·
  vivid-primary·snappy)이지만, 이 팩의 표제는 20pt에 머물고 잉크 4% 미만·모션
  0으로 반대 극에 있다. 5축 중복은 세 팩 모두 2축 이하.

changelog: >-
  2026-08-16 v3 신규 집필. 슬러그의 "warmgray"는 스카우트 단계 관찰명 —
  정독 실측 결과 지면은 순백 #FFFFFF이고 회색 기운은 #F3F4F5 패널에서 온
  것으로 정정됨(visual_spec notes). 슬러그는 유지하되 색 명세는 실측을 따른다.
  2026-08-16 v3.1 fidelity 반려(19/28) 수리 — must_preserve 시그니처 복원
  지시 강화(횡단 이익률 꺾은선·우측 KPI 델타 4단 열·#9ECCFC 칩 행·전 패널
  범례+단위 3종 세트·코멘터리 '·' 불릿·워터폴 요인 라벨/화살표 위계),
  환각 10건 금지 명문화(사다리형 비율 표기·회색 타원 위치 기호·인라인
  화살표 시계열·텍스트형 KPI·비대칭 트윈 패널·형광펜 과대 일반화·칩 버튼
  행·균등 카드 그리드·재무제표 본문 볼드/전면 음영), 표 음영 규칙을
  지표군별 개별 적용으로 정정, 동일 라벨=동일 값 정합 규칙과 잉크 분포
  합격 기준 추가.

