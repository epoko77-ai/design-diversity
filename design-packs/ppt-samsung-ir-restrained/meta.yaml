license: "원자산은 삼성전자 라이선스를 따름. 본 팩이 배포하는 것은 디자인 명세·토큰이며 원자산 사본·이미지 사본이 아님. SamsungSharpSans·SamsungOne·SamsungOneKorean 등 독점 폰트는 라이선스상 제3자 사용 금지 — 오픈 폰트 Manrope(영문) + Pretendard(한글)로 대체. 'SAMSUNG' 워드마크 자체는 등록 상표이므로 실제 배포물에는 반드시 자체 회사명·자체 워드마크로 교체 (재현 fixture에서는 placeholder)."
