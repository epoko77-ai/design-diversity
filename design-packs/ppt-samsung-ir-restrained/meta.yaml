  - "diagram·narrative 슬롯의 timeframe section hairline y 위치 가이드 추가 (≈27%, 49%, 71%)"
v1_to_v2_diff:
  - "v1 강조색 #1428A0 가정 → 실측 #0028A8 (더 cyan-leaning, R=0 G=40 B=168)"
  - "v1 paired side-by-side 막대 가정 → 실측 모든 차트는 stacked + 단일 series(회색 + 파랑 2색)"
  - "v1 KPI 56pt 가정 → 실측 44~48pt, 'T' 접미사 동일 크기·동일 색"
  - "v1 녹/적 증감 코딩 가정 → 실측 ↑·↓ 양쪽 모두 #0028A8"
  - "v1 IBM Plex Sans + IBM Plex Mono 가정 → 실측 SamsungSharpSans + SamsungOne (오픈 폴백 Manrope·Pretendard)"
  - "v1 본문 페이지 컬러 헤더 banner 가정 → 실측 거의 보이지 않는 subtle 헤더 그라데이션 0~21% + 1px hairline만"
  - "v1 표 zebra-fill / vertical column rule 가정 → 실측 행간 1px #D8DBE2 hairline만 (외곽 frame·컬럼 라인·zebra 일체 없음)"
  - "v1 모든 페이지 페이지 번호 가정 → 실측 페이지 번호 15장 전부 부재"
  - "v1 강한 12열 strict 그리드 가정 → 실측 콘텐츠 주도 비대칭 분할 (1:1, 3:2, 1:2 페이지마다 다름)"
  - "v1 부문 트리·프로세스 플로우·매트릭스·워터폴 다이어그램 가정 → 실측 부재. commentary tab hairline 양식이 사실상의 다이어그램."
