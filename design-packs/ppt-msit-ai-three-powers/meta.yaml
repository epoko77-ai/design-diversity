diagram_kit: "색띠 3컬럼 체크리스트(상단 캡슐 '국가 최대 위기를 극복' + #1A4BC6 헤더 + ✓ 4행 + 하단 흰띠 요약, 02-agenda) /
  병렬 3-전략 알약 카드(블루→퍼플 #2366D9→#4369EE→#4857D6 단색 채움, 03-section) /
  비대칭 상2+하 박스 안 3컬럼(좌 'AI' 그라디언트 박스 + 우 카드 3적층 + 하 풀폭 카드 안 3 서브컬럼, 04-key-message) /
  4+4 적층 그리드 + 우측 보조 + 좌→우 단색 화살표(05-chart, 실제 차트 없음 — 차트는 08) /
  좌 2×2 아이콘 + 우 3컬럼 원형 아이콘 + 하 가로 2카드(06-diagram K-문샷·바이오·양자·핵융합 + 출연연 개편) /
  좌 2×2 + 우 2카드 + 우 끝 누리호 로켓 사실적 일러스트(07-cards) /
  2×3 행 헤더 매트릭스(세로 알약 행 헤더 #0F41BD + 3카드 ×2행, '자력 R&D' 카드에 미니 2-막대 막대차트 임베드, 08-comparison) /
  방사형 허브-스포크 거버넌스 다이어그램(중앙 부처 + 8~12 위성 노드 + 0.75pt #C5D3E2 직선 + 상단 '부처 AX·혁신 지원' 칩 + 하단 'R&D 예산 전략적 배분·조정' 칩 + 배경 ~20% 글로우, 09-narrative — 클라이맥스) /
  가로 1Q→4Q 분기 타임라인(4 노드 + 1.5pt #002060 화살표, 10-closing 좌) /
  미니 알약 strip(p-3 1/3 미니, 단색 #2366D9/#4369EE/#4857D6, 10-closing 우) /
  차트=단순 평면 2-막대 1개(축선·격자선 없음, 화살표 증가, 단색 네이비/하이라이트 블루).
  모두 SVG 정밀 렌더, div 블록·3D·그림자·글로우·이모지 아이콘 금지. 사이언/청록 사용 금지(그라디언트는 03·10 우측 미니 + 표지 + 04 'AI' 박스 한정).
  v3 신규: #C5D3E2 연결선 색 / 05 좌→우 화살표 / 04 우측 카드 적층 정정 / 10-closing 분기 타임라인."
