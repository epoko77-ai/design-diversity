differentiation: >-
  카탈로그에 그린 주색 PPT 팩이 없다. ppt-naver-integrated-report-award는
  단일 비비드 그린 #03C75A가 지면 전체를 주도하는 라이트 웹톤 테크 브랜드 스타일이지만,
  본 팩은 그린 3톤을 커버·디바이더의 그래픽 장치에만 격리하고 데이터 지면은 전부
  네이비 #002554 + 연블루 #E5EBF7의 재무 IR 문법으로 구성한다 (근거: 원본 p4~15·17~21
  전 데이터 페이지에서 표·본문 그린 0건, 유일 예외 p15 #E2F0D9 헤더). 파셋 다면 분할,
  산업 라인 아이콘 스트립, QoQ/YoY 상주 컬럼, 워터폴 고스트 컬럼은 기존 100팩에 없는
  장치이며, 중공업 그룹 아이덴티티(선박·플랜트·엔진 도메인의 라인 아이콘 문법)가
  현대차의 사진 중심 덱·크래프톤의 다크 게이밍 덱과도 구별되는 축이다.

