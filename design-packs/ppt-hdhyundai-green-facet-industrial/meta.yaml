    name: 3단 명도 그린 파셋 폴리곤(커버 solid) + 헤어라인 와이어프레임 변주(디바이더)
    evidence_pages: [1, 2, 3, 16]
    where: 커버 우측 60~99%W 채운 면(solid) 버전, Disclaimer/Contents/별첨 우측 1/4에 스트로크(outline) 버전. 본문 데이터 페이지에는 절대 등장하지 않음
    uniqueness: >-
      IR 덱에서 브랜드 그래픽을 solid↔wireframe 2모드로 운용하는 이중 문법.
      채도 높은 3톤 그린(#35D32F/#00AE41/#00823D)의 다면 분할 —
      타 기업 IR은 단색 도형이나 사진을 씀
    must_preserve: true
  - rank: 2
    name: 네이비 #002554 재무 매트릭스 + #E5EBF7 하이라이트 열 + 빨간 괄호 음수
    evidence_pages: [4, 7, 17, 18, 19, 20, 21]
    where: 요약·회사별·별첨 재무표 전부. QoQ/YoY 파생 열 또는 최신 분기 그룹에만 하이라이트
    uniqueness: >-
      그린 브랜드 컬러를 표에는 한 방울도 쓰지 않고 네이비+연블루로만 구성 —
      그래픽(그린)과 데이터(네이비)의 역할 분리가 이 덱의 결정적 규율
    must_preserve: true
  - rank: 3
    name: 자회사 표준 템플릿 — 좌 스택바+OPM 라인 / 우 네이비·그린 세로 라벨 2블록 + QoQ/YoY 컬럼
    evidence_pages: [8, 9, 10, 11, 12, 13]
    where: 본문 6페이지 연속. 세로 라벨 '매 출'=네이비 #002554, '영업 이익'=그린 #4BAB6B 고정 부호화
    uniqueness: >-
      6페이지를 한 치 안 틀리고 반복하는 템플릿 규율 자체가 시그니처.
      좌우를 수직 점선으로 분할하고 최우측에 QoQ/YoY 지표 열
      (#DEEBF7 헤더 + #F2F2F2 컬럼)을 상주시킴
