v3_focus: "v2 색·타입·시그니처 1픽셀 변경 없이 계승 + 10 슬라이드 카테고리 × 원본 71페이지 1:1 mirror 매핑 + 24 시각 어휘 사전. 어느 슬라이드를 만들 때 원본 어느 페이지를 그대로 따라야 하는지 page mirror plan 표가 SSOT."
summary: "현대차 인베스터데이처럼 다크 네이비 무대에 미래적 사이안 라인이 흐르는 컨퍼런스 키노트 톤. 거대한 흰색 숫자, ∞ 모양 컨셉 다이어그램, 7장 카드에 큰 사이안 숫자가 박힌 양식 — AI·EV·미래 모빌리티·신사업 발표, 테크 컨퍼런스 키노트에 어울립니다."
axes:
  color: dark
  type: heavy-display
  layout: full-bleed
  space: balanced
  motion: subtle
diagram_kit: "Chevron motif = 중첩 우향 > 3~5 스택 (cover/closing LEFT 5-stack / 단어1개 chapter RIGHT 4-stack / 다단어 chapter RIGHT 2-3 arc + LEFT starburst) + 흰-사이안 V-vertex 글로우 / HYUNDAI WAY ∞ (p-07 deck 단 1번) = 좌 lobe 사이안-블루 그라디언트 #0060A8→#002C5F Mobility + 우 lobe teal #189078→#0E5645 Energy + 교차점 위 사이안 'Hyundai Dynamic Capabilities' / Chevron-tabbed 단계 헤더 (p-48/p-52) = trapezoidal chevron 탭 행 active 1개만 #66FFFF / 서브챕터 좌 50% 분할 패널 (p-17) / 3-원형 배지 (p-59/p-69) = #04599D fill + 2px #66FFFF outer ring, NO per-badge color / 카드 enumerator 그리드 (p-64) = 4+3 비대칭 7카드, 거대 사이안 SOLID 숫자 01~07 80-100pt / KPI 히어로 (p-18) = 거대 흰 numeral 140-160pt + 단위 45-55pt + 3-pill row + 하단 panoramic / narrative 4-card stack + hero (p-09) = 좌 60% 정확히 4 카드 + 우 40% 산업 클로즈업 / 시계열 3-col + powertrain 배지 + 직선 화살표 (p-65) / 밸류체인 3-col table + chevron-tab 헤더 horizontal hairline only (p-52) / 글로벌 지도 (p-22) = 다크 세계지도 + 국기 callout / SDV hub-spoke (p-35) = 중앙 차량 + 곡선 cyan 화살표 + HW/SW/Service 3-tier / 차트 (p-48 라인, p-60 stacked bar tonal, p-16 도넛 isometric, p-10 라인+region paired bar) = 단일 cyan-blue family tonal layering, top #66FFFF·mid #00D3FD·base #0060A8 NOT 무지개"
