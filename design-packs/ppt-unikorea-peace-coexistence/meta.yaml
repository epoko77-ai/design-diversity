signature_top5:
  - 한반도 발광 지도 (북엔드 모티프) — 표지·종결에 동일 형태로 정확히 2회. 북 #A41729/#C91E28/#9D204B + 남 #5794C3/#4AA2C1/#1566A5
  - 손글씨 캘리그래피 슬로건 — #F59751 오렌지(본문) / #FFFF66 네온 골드(종결). 슬라이드당 정확히 1회
  - Roman numeral 원형 태그 — Ⅰ~Ⅳ가 #105FD2 또는 #08306C 원 안 흰 숫자. 4분할 agenda + 본문 breadcrumb 일관
  - 다크 #050829 풀-블리드 위 흰 떠있는 카드 + 좌측 #105FD2 5~10% 컬러 스트립
  - 듀얼 비교 색 페어 — 좌 #105FD2 블루(미국·우방) / 우 #A41729 레드(북한). 한반도 모티프와 색 인코딩 일치
diagram_kit: "프로세스 = 3~4 단계 흰 카드 노드 + 좌측 #105FD2 컬러 스트립 + 좌상단 Roman numeral 원 + 1.5pt 직각 화살표 / 3-column 카드 그리드 = 반복 양식(p06/p09/p10 mirror), 각 카드 상단 #105FD2 원형 번호 + 좌측 컬러 스트립 / 4-column agenda = 카드 상단 #105FD2 원 + 흰 Roman numeral + 라인 일러스트 / 듀얼 비교 = 2-column 좌 #105FD2 우 #A41729 페어 + 인용문 + 사진 / 매트릭스 = 흰 카드 + 0.75pt 십자 축 + 0.3in #105FD2 원형 버블 / 내러티브 = 01~04 #08306C 깊은 네이비 원(직경 0.6in) + 그레이 카드 + 우측 인물 사진/Quote / 노드 그리드 인포그래픽 = 흰 카드 안 파스텔 크림 #FFF0B9 + 파스텔 시안 #9EDBF4 노드(체크리스트) / 차트 = 흰 카드 컨테이너 + #105FD2 막대 + 직접 라벨링 + 출처 의무 / 캘리그래피 박스 = #FAE1C6→#F4B673 그라데이션 + 손글씨 #F59751 36pt / 블루 리본 바 = 푸터 #105FD2 풀폭 띠 + 흰 16pt SemiBold 슬로건"
