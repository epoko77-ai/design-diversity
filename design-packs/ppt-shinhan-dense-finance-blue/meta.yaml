differentiation: >-
  카탈로그의 정부 부처 청색 덱 5종과 같은 '블루 계열'이지만 문법이 다르다.
  부처 덱은 메시지·다이어그램 중심(대형 슬로건 타이포, 정책 다이어그램, 페이지당 표 0~1개)인 반면,
  이 팩은 민간 금융 IR의 데이터 언어다 — 근거: ① 31페이지 중 표 페이지 21장·부록 11컬럼 표군(원본 p10, 19~29),
  ② 웹사이트형 6탭 상주 내비게이션(전 내지, motif 5 — 부처 덱에 부재), ③ 현재기 컬럼 #EDF7FE 밴딩과
  Δ 프리픽스 음수라는 증감 표기 문법(motif 2·3 — 부처 덱은 빨강/파랑 의미색 사용),
  ④ 축·격자를 소거하고 값 전량을 레이블로 박는 브리지·인셋·콜아웃 차트 문법(motif 7),
  ⑤ 9~10pt대 표 본문의 열람형 고밀도 조판(발표형 대형 타이포의 정반대).

