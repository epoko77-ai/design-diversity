signature_motifs:
  - rank: 1
    name: 울트라마린 #0046FF 3톤 단색 시스템
    evidence_pages: [1, 2, 3, 5, 7, 12, 13, 17, 21]
    where: 표지 타이틀·내비·표 헤더·KPI 카드·바 차트·섹션 표제·로고 블록까지 전 요소가 #0046FF / #4BAFF5 / #AFABAB 3톤. 시안 #00B0F0은 콜아웃·Target 한정
    uniqueness: >-
      국내 금융 IR 중에서도 의미색(빨강/초록)을 완전히 버리고 브랜드 블루 하나로
      위계 전체를 세운 극단적 단색 규율
    must_preserve: true
  - rank: 2
    name: Δ 음수 표기 규율
    evidence_pages: [2, 3, 5, 7, 8, 9, 16, 21, 22, 25]
    where: 표 숫자·차트 레이블·본문 불릿의 모든 감소값. Δ216.5, Δ23.7%, Δ6bp. 빨강·괄호·마이너스 기호 불사용
    uniqueness: 음수를 색이 아니라 그리스 문자 프리픽스로 처리 — 단색 시스템을 지키는 핵심 장치
    must_preserve: true
  - rank: 3
    name: 블루 솔리드 헤더 + 현재기 컬럼 밴드 재무표
    evidence_pages: [3, 4, 5, 6, 8, 9, 10, 19, 21, 26, 27]
    where: >-
      모든 재무표: #0046FF 헤더(흰 텍스트, 첫 셀 단위 표기), 현재기 컬럼 #EDF7FE 밴드+볼드,
      그룹 행 풀행 밴드, 점선 행 구분, 우측 정렬 숫자, 빈 셀 대각선 해칭
    uniqueness: 컬럼 하나를 밴딩해 '지금 분기'로 시선을 고정하는 표 문법이 덱 전체에서 한 치도 흔들리지 않음
    must_preserve: true
  - rank: 4
    name: 웨이브컷 막대 (하단 물결 축 생략)
    evidence_pages: [3, 9, 14, 16]
    where: 값 대비 스케일이 큰 총계 바의 하단부를 흰 물결선 2줄로 끊어 절단 표시. 브리지 양끝 총계 바(p3·9), CET1 RWA 바(p14), 유통주식수 바(p16)
    uniqueness: 축을 아예 그리지 않는 대신 바 몸통에 절단 기호를 새기는 방식 — 이 덱의 가장 시각적인 지문. 물결은 바 하단부에 위치(상단 아님)
    must_preserve: true
  - rank: 5
    name: 상주형 6탭 내비게이션 + 우상단 로고 블록
    evidence_pages: [2, 3, 5, 12, 14, 19, 29]
    where: >-
      본문 전 페이지 상단. 활성 탭 = #0046FF 텍스트만(밑줄 없음 — 픽셀 스캔 확인), 비활성 #5A5A5A.
      우상단 블루 라운드 사각 로고가 상단 모서리 맞닿음. 간지·공지(18, 30, 31)는 탭 대신 풀폭 그레이 룰
    uniqueness: 덱 전체를 웹사이트처럼 항행하게 만드는 상주 내비 — 발표덱보다 열람형 IR 문서의 문법
    must_preserve: true
  - rank: 6
    name: 좌 블루 바 + 카테고리 프리픽스 + 원문자 번호 섹션 표제
    evidence_pages: [3, 5, 9, 13, 17, 21, 30]
    where: "본문 전 페이지: 소형 카테고리 프리픽스 + ①~⑩ 원문자 + 블루 볼드 타이틀, 좌측 세로 블루 바"
    uniqueness: 내비 탭과 표제 프리픽스가 같은 분류 체계를 이중으로 새겨 현재 위치를 항상 고지
    must_preserve: true
  - rank: 7
    name: 그레이 카드 무축 차트 문법 (브리지·점선 인셋·블루 콜아웃)
    evidence_pages: [3, 4, 5, 7, 9, 11, 14, 15]
    where: >-
      우측 컬럼 #F9F9F9 카드: 그레이 타이틀 + '(단위)' 우상단, 축·그리드 0, 값 전량 직접 레이블,
      증가/감소/총계 브리지(p3 증가=라이트블루·감소=그레이, p9는 역전), 최근 분기 점선 테두리 인셋,
      +N%/ΔN% 블루 테두리 콜아웃 박스 + 꺾인 연결 화살표
    uniqueness: 차트가 '그림'이 아니라 표의 연장 — 모든 수치가 레이블로 존재하고 축은 소거된 데이터 밀도 우선 문법
    must_preserve: true

