summary: >-
  울트라마린 #0046FF 3톤 단색 규율, 6탭 상주 내비게이션, 현재기 컬럼 밴드 재무표,
  Δ 음수 표기, 웨이브컷 총계 바, 무축 직접 레이블 차트가 결합된 초고밀도 민간 금융 IR 덱 스타일.
