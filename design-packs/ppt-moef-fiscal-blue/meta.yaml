diagram_kit: "(a) 가로 그라데이션 화살표 리본 (navy #425C8C → teal #20988F → cyan #04AFE3, 폭 90%, h 16%) + 6 드롭핀 마일스톤 (x centers [10,24,40,56,70,86]%, fill #E0E5EB, flat line-art glyph) — 각 드롭핀 위 월 라벨 16pt Bold 흰, 리본 내부 2줄 콜아웃 (1줄 노란 #FFFF00 형광 14pt 검정 Bold 3/6에만 + 2줄 굵은 흰 16pt) / (b) 쌍 거대 원 + 위성 박스 — 좌 sky #1F91DF '기회' 우 deep-blue #283473 '도전' Black 56pt 흰, 직경 28%, x center 36%/62%, 좌우 3 위성 박스 세로 적층 + 미니 차트 / (c) 중앙 다이아몬드 + 4분면 위성 — #1A223F 다크네이비 fill 45deg 회전 정사각형 w 22% h 30%, 흰 Bold 16pt 3줄 슬로건, 상/우/하/좌 4 quadrant pill (royal/purple/royal/royal) / (d) 컬러 필 박스 헤더 + 노란 강조 (워크호스 모듈) — radius 24px pill 4색 + 좌측 노란 카테고리 배지 ('국정과제 N' / '2026 업무추진방향' / '1월중') + 흰 콘텐츠 박스. 2-col/2x2/2x3/2-col+bottom-band 그리드. 헤더 콜론 뒤 1~3 글자 노란 형광 키워드 의무 (때로 2개) / (e) 3패널 단일 라인 차트 — 본문 3등분 (폭 31%, 간격 2.5%, y 22~85%), pill 헤더 sky/teal/purple + bracketed topic 라벨 + 단색 1.5pt 라인 (sky/green/purple) + 강조 포인트 22pt Bold 패널 색 수치 + 우 패널 위쪽 노란 #FFFF00 콜아웃 박스 + 2줄 takeaway / (f) 5단 수평 밴드 스택 — 각 띠 h 13%, 좌측 30% 컬러 라벨 영역 위→아래 그라데이션 시퀀스 royal #4987BF → purple #5464A6 → teal #20988F → cyan #28A4CA → lighter cyan #04AFE3, 우측 70% 흰 콘텐츠 영역. 헤더 노란 키워드 2개 / (g) 손글씨 메모 오버레이 (일회성, narrative) — 헤더 subthesis 大 36pt 노란 형광 echo + 중앙 -8deg 크림 #FCFCF6 메모지 w 35% h 55% + soft drop shadow + 6 numbered 원형 배지 직경 8% 부채꼴 (3 left + 3 right, sky/teal/purple/royal/sky/purple) + 메모로 가는 hairline gray dotted 연결선 / 디바이더 = #05091A 라디얼 스포트라이트 + 화면 정중앙 흰 Bold 'Ⅰ.' 'Ⅱ.' 로마 숫자 + 한글 섹션명 42pt (로마 숫자만 한글보다 ~10pt 큼, 96pt Light·흰 배경·영문 라벨 금지) / 마무리 = #000000 순검정 + 우상귀 미세 cyan glow streak + 중앙 흰 Bold 40pt '한국경제 [大] 도약'(大 60pt 노란 형광 echo) + 32pt '이재명정부가 반드시 실천하겠습니다' + 18pt 2줄 submark + 22pt '감사합니다'"
