    evidence_pages: [1, 3, 5, 8, 12, 13, 15, 18]
    where: 순흑 디바이더의 'PART N.'(활성 흰색/비활성 #1A1A1A 고스트), p13 '15,362' p15 '80명' p18 '5건' 같은 히어로 숫자, 표지·p3의 초대형 로고타입
    uniqueness: 노치 있는 각진 스텐실체를 숫자에까지 쓰는 조판. 고스트 목차(활성/비활성 1.2:1 저대비)도 이 덱 고유
    must_preserve: true
  - rank: 5
