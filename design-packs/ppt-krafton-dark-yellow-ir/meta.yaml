    uniqueness: 축·격자 전무, 수치 직접 기입, 옐로 1점 강조 — 게이밍 브랜드 색을 데이터 강조에 그대로 씀
    must_preserve: true
  - rank: 6
    name: 선 규약 — 옐로 실선=강조/확정, 점선=미공개/예정, 흰 스트로크 라운드 필=컬럼 라벨
