    name: 사선 컷 키아트 콜라주 + 회색 감쇠 오버레이
    evidence_pages: [3]
    where: 섹션 인트로 1곳. 키아트를 평행사변형으로 잘라 유격을 두고 배열, #454545 회색 패널로 여백 채움, 사진 전체를 회색조로 눌러 흰 타이포 대비 확보(실측 9.6:1)
    uniqueness: 사진 자체가 아니라 '사선 컷 + 감쇠 오버레이 + 회색 패널 보간'이라는 처리 방식이 자산
