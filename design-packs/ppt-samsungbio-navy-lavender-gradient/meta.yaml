differentiation: >-
  카탈로그의 그라디언트 계열 3팩과 축이 겹치지 않는다.
  (1) ppt-skt-interactive-ai-pyramid: 순백 배경+단일 솔리드 #0023C3이 정체성
  (tokens.json에 그라디언트 부재·chapter_color_variation none 명시), 시그니처는 피라미드
  3D·탭 내비 — 본 팩은 그라디언트 자체(#1D2672→#AB99F7 수평 밴드)가 정체성이고 다크
  페이지가 덱의 37.5%로 색 운용 원리가 정반대.
  (2) ppt-vivid-gradient-future: 마젠타·블루·시안 4정점 메시 그라디언트가 배경 전체를
  채우는 글래스모피즘 다크 덱(radius 20pt, 글로우 커넥터) — 본 팩은 그라디언트가 배경이
  아니라 밴드·바 2계층 구조 요소에만 놓이고 본문 배경은 순백, hue도 네이비-라벤더 단일 축.
  (3) ppt-vivid-gradient-infographic-deck: 바이올렛→코랄(#7C3AED→#FB6F5C) 135° 대각
  그라디언트를 라운드 칩·필 모듈에 쓰는 라이트 인포그래픽 — 본 팩은 수평 0° 그라디언트,
  직각 테이블·바 기반, 궤도 원호·스피어·페리윙클 테이블이라는 IR 고유 모티프 어휘로
  무교집합. 근거: visual_spec/samsungbio.json의 vs_existing_catalog + 각 팩 tokens.json 대조.

